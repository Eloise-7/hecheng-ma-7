<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
  <meta name="theme-color" content="#fffaf0">
  <meta name="description" content="轻轻投下图标，让相同的图标相撞合成，看看你能走多远。">
  <title>合成🐎＋7</title>
  <style>
    :root{color-scheme:light;--ink:#493c32;--muted:#9c8e7d;--cream:#fffaf0;--line:#eadfc9;--orange:#f17d60;--gold:#efbd5c;--shadow:0 16px 48px #8e76521a}
    *{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:ui-rounded,"PingFang SC","Microsoft YaHei",system-ui,sans-serif;color:var(--ink)}
    body{min-height:100vh;background:radial-gradient(ellipse at 15% 10%,#ffe9c9 0,transparent 29%),radial-gradient(ellipse at 88% 78%,#f9dfe4 0,transparent 30%),linear-gradient(145deg,#fff8e8,#fffdf7 52%,#fbf1e7);display:flex;justify-content:center;overflow-x:hidden}
    button{font:inherit;color:inherit;border:0;cursor:pointer}button:focus-visible,input:focus-visible{outline:3px solid #efbd5c;outline-offset:3px}
    .app{width:min(100%,580px);padding:14px 14px 30px;display:flex;flex-direction:column;align-items:center;gap:12px}
    .topbar{width:100%;display:grid;grid-template-columns:1fr 1fr 48px 48px 86px;gap:7px;padding:7px;background:#ffffffd9;border:1px solid #fff;border-radius:24px;box-shadow:var(--shadow);backdrop-filter:blur(12px)}
    .scorebox{min-width:0;background:#fffdfa;border-radius:17px;padding:7px 12px;display:flex;flex-direction:column;justify-content:center;gap:1px;box-shadow:inset 0 0 0 1px #f3eddf}
    .scorebox span{font-size:10px;color:var(--muted);letter-spacing:.04em}.scorebox strong{font-size:20px;line-height:1.1;font-weight:800;color:#5a493c;font-variant-numeric:tabular-nums}
    .iconbtn,.restart{height:44px;border-radius:17px;background:#fffdfa;box-shadow:inset 0 0 0 1px #f2eddf;font-size:18px;transition:transform .16s,box-shadow .16s}.iconbtn:hover,.restart:hover{transform:translateY(-2px);box-shadow:0 6px 14px #6040201a}.iconbtn[aria-pressed="false"]{opacity:.55}
    .restart{background:linear-gradient(145deg,#f5946e,#e76859);color:white;font-size:13px;font-weight:800;box-shadow:0 5px 12px #e7685933}
    .board-shell{position:relative;width:min(100%,420px);padding:10px;border-radius:32px;background:linear-gradient(145deg,#fff,#fbf4e6);border:1px solid #fff;box-shadow:0 17px 44px #83704a21,inset 0 0 0 1px #efe7d7}
    .board{position:relative;width:100%;aspect-ratio: .56;min-height:480px;max-height:72vh;border-radius:23px;overflow:hidden;border:1px solid #e5d9c2;background:linear-gradient(180deg,#fffdf9 0%,#fff9ea 38%,#fff3d9 100%);touch-action:none}
    canvas{display:block;width:100%;height:100%;touch-action:none}
    .next-card{position:absolute;z-index:2;right:14px;top:12px;display:flex;align-items:center;gap:6px;padding:5px 8px 5px 10px;border-radius:14px;background:#ffffffd9;box-shadow:0 4px 14px #7b65451a;pointer-events:none}
    .next-card span{font-size:10px;color:#98836b}.next-card canvas{width:32px;height:32px}
    .hintline{position:absolute;z-index:2;left:12px;right:12px;top:24%;border-top:2px dashed #d9c9aa8c;pointer-events:none}
    .modal{position:absolute;inset:0;z-index:5;display:none;align-items:center;justify-content:center;padding:20px;background:#46382f5c;backdrop-filter:blur(4px)}.modal.open{display:flex}
    .dialog{width:min(100%,340px);max-height:88%;overflow:auto;padding:22px 20px 18px;border-radius:26px;text-align:center;background:linear-gradient(155deg,#fffdf8,#fff5df);border:1px solid #fff;box-shadow:0 20px 60px #32241f33;animation:pop .2s ease-out}
    @keyframes pop{from{opacity:0;transform:translateY(9px) scale(.97)}to{opacity:1;transform:none}}
    .modal-icon{font-size:38px;line-height:1}.dialog h2{margin:9px 0 4px;font-size:22px}.dialog p{margin:8px 0;color:#897967;font-size:13px;line-height:1.65}.modal-score{margin:12px 0;font-size:14px}.modal-score b{color:#e87959;font-size:24px}
    .actions{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:16px}.pill{padding:11px 15px;border-radius:15px;background:#f4eddf;font-size:13px;font-weight:750}.pill.primary{background:linear-gradient(145deg,#f29a69,#e96f5c);color:white;box-shadow:0 5px 12px #e56a5838}.pill.gold{background:#f4c768;color:#573e1e}.pill:hover{filter:brightness(1.03);transform:translateY(-1px)}
    .nick-row{margin:13px 0 5px;font-size:12px;color:#968575}.nick-row button{background:none;color:#dc785d;text-decoration:underline;text-underline-offset:3px}.name-input{display:none;width:100%;margin-top:8px;padding:10px 12px;border:1px solid #e8dbc1;border-radius:12px;background:white;font:inherit;text-align:center}
    .leader-list{max-height:240px;overflow:auto;margin:13px 0 6px;padding:0;list-style:none;text-align:left}.leader-list li{display:grid;grid-template-columns:34px 1fr auto;gap:8px;align-items:center;padding:9px 10px;border-bottom:1px solid #eee5d5;font-size:13px}.leader-list li:first-child{color:#bd8524}.leader-list .rank{font-weight:800;color:#aa997f}.leader-list strong{font-variant-numeric:tabular-nums}
    .underbar{width:min(100%,420px);display:flex;align-items:center;justify-content:center;gap:8px;flex-wrap:wrap}.underbar .pill{padding:9px 13px;border-radius:13px;background:#fffdf8;box-shadow:0 3px 12px #806b4915;font-size:12px}.rule-note{width:min(100%,420px);text-align:center;color:#877967;font-size:12px;line-height:1.8;padding:3px 7px 0}.rule-note strong{color:#705a46}.merge-card{width:min(100%,420px);padding:13px 14px;border-radius:20px;background:#ffffffa8;border:1px solid #fff;box-shadow:0 7px 22px #806b4910}.merge-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px;font-size:13px;font-weight:800}.merge-head small{font-weight:500;color:#a19483}.merge-grid{display:grid;grid-template-columns:repeat(6,1fr);gap:5px}.merge-item{display:flex;flex-direction:column;align-items:center;gap:3px;min-width:0;padding:7px 3px;border-radius:14px;background:#fffdf8}.merge-item canvas{width:36px;height:36px}.merge-item span{font-size:9px;color:#8c7e6c;white-space:nowrap}.footer{font-size:10px;color:#afa18e;text-align:center;padding-top:3px}
    @media(max-width:400px){.app{padding:9px 9px 23px;gap:9px}.topbar{grid-template-columns:1fr 1fr 42px 42px 72px;gap:5px;padding:6px}.scorebox{padding:6px 9px}.scorebox strong{font-size:18px}.iconbtn,.restart{height:41px;border-radius:15px}.board-shell{padding:8px;border-radius:27px}.board{border-radius:19px;min-height:0;max-height:74vh}.merge-grid{grid-template-columns:repeat(5,1fr)}}
    @media(max-height:740px){.board{max-height:67vh;min-height:380px}}
    @media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important;scroll-behavior:auto!important}}
  </style>
</head>
<body>
  <main class="app" aria-label="合成🐎＋7游戏">
    <header class="topbar">
      <div class="scorebox"><span>分数</span><strong id="score">0</strong></div>
      <div class="scorebox"><span>最高分</span><strong id="best">0</strong></div>
      <button class="iconbtn" id="boardBtn" aria-label="打开排行榜" title="排行榜">🏆</button>
      <button class="iconbtn" id="soundBtn" aria-label="切换音效" aria-pressed="true" title="音效开关">🔊</button>
      <button class="restart" id="restartBtn" title="重新开始">↻ 重开</button>
    </header>
    <section class="board-shell" aria-label="游戏区域">
      <div class="board" id="board">
        <canvas id="game" aria-label="游戏画面，移动瞄准并点击投放"></canvas>
        <div class="hintline"></div>
        <div class="next-card"><span>下一个</span><canvas id="nextIcon" width="64" height="64"></canvas></div>
        <div class="modal" id="reviveModal" role="dialog" aria-modal="true" aria-labelledby="reviveTitle">
          <div class="dialog"><div class="modal-icon">😵</div><h2 id="reviveTitle">还能再救一下</h2><p class="modal-score">本局得分 <b id="reviveScore">0</b></p><p>清掉警戒线以上的图标，接着玩</p><div class="actions"><button class="pill" id="declineRevive">结束本局</button><button class="pill gold" id="useRevive">🪙 用一枚复活币</button></div><p id="coinCount" style="margin-top:10px">还剩 0 枚</p></div>
        </div>
        <div class="modal" id="overModal" role="dialog" aria-modal="true" aria-labelledby="overTitle">
          <div class="dialog"><div class="modal-icon">😵</div><h2 id="overTitle">游戏结束</h2><p class="modal-score">本局得分 <b id="finalScore">0</b></p><p>最高分 <strong id="finalBest">0</strong></p><div class="nick-row">昵称：<span id="nickLabel">玩家</span> <button id="editName">改昵称</button><input class="name-input" id="nameInput" maxlength="12" aria-label="我的昵称" placeholder="输入昵称"><button class="name-input" id="saveName">保存昵称</button></div><div class="actions"><button class="pill" id="boardBtn2">🏆 排行榜</button><button class="pill primary" id="againBtn">再来一局</button><button class="pill" id="sponsorBtn">✨ 支持作者</button></div><p>按 R 键也可重新开始</p></div>
        </div>
        <div class="modal" id="boardModal" role="dialog" aria-modal="true" aria-labelledby="boardTitle">
          <div class="dialog"><h2 id="boardTitle">🏆 最近高手榜</h2><p>本机最近 20 次成绩</p><ul class="leader-list" id="leaderList"></ul><div class="actions"><button class="pill" id="boardClose">关闭</button><button class="pill primary" id="boardRefresh">刷新</button></div></div>
        </div>
        <div class="modal" id="supportModal" role="dialog" aria-modal="true" aria-labelledby="supportTitle">
          <div class="dialog"><div class="modal-icon">✨</div><h2 id="supportTitle">谢谢你喜欢这个小游戏</h2><p>《合成碰碰乐》是一个小小的独立作品。分享给朋友，就是很棒的支持。</p><div class="actions"><button class="pill primary" id="supportClose">继续游戏</button></div></div>
        </div>
      </div>
    </section>
    <div class="underbar"><button class="pill" id="boardBtn3">🏆 排行榜</button><button class="pill" id="restartBtn2">↻ 重开</button><button class="pill" id="helpBtn">⌨️ 操作说明</button></div>
    <section class="merge-card" aria-label="合成图鉴"><div class="merge-head"><span>合成图鉴</span><small>两个相同图标相撞即可合成</small></div><div class="merge-grid" id="mergeGrid"></div></section>
    <p class="rule-note"><strong>鼠标</strong>：移动瞄准、点击投放；<strong>触屏</strong>：拖动瞄准、松手投放。<br>← → 微调位置，空格投放，R 重开。每 2000 分获得一枚本局复活币。</p>
    <p class="footer">图标可以替换成你喜欢的样子</p>
  </main>

        if(a.lvl===b.lvl&&mergeCooldown<=0){const lvl=a.lvl,x=(a.x+b.x)/2,y=(a.y+b.y)/2;balls.splice(j,1);balls.splice(i,1);if(lvl===levels.length-1){addScore(500);coins++;toast('+500 分 · 复活币 +1');sound(880,.14)}else{balls.push({x,y,vy:-110,vx:(Math.random()-.5)*90,r:levels[lvl+1].r*.6,lvl:lvl+1,still:0,sleeping:false});addScore(10*(lvl+1));sound(660+lvl*40,.09)}mergeCooldown=.055;break}
        const moving=Math.hypot(a.vx,a.vy)>8||Math.hypot(b.vx,b.vy)>8;if(moving){a.sleeping=false;b.sleeping=false;a.still=0;b.still=0}const overlap=min-d;a.x-=nx*overlap*.28;a.y-=ny*overlap*.28;b.x+=nx*overlap*.28;b.y+=ny*overlap*.28;const rel=(b.vx-a.vx)*nx+(b.vy-a.vy)*ny;if(rel<0){const imp=-rel*.08;a.vx-=imp*nx;a.vy-=imp*ny;b.vx+=imp*nx;b.vy+=imp*ny}
      }
      for(const b of balls){const speed=Math.hypot(b.vx,b.vy);b.still=speed<18?(b.still||0)+dt:0;if(b.still>.08&&speed<24){b.vx=0;b.vy=0;b.sleeping=true}}
      if(balls.some(b=>b.y+support(b,0,-1)<lineY()&&b.still>=.45)){gameState='revive';document.getElementById('reviveScore').textContent=score;document.getElementById('coinCount').textContent=`还剩 ${coins} 枚`;document.getElementById('useRevive').disabled=coins<=0;document.getElementById('reviveModal').classList.add('open')}
    }
    function frame(t){if(!lastTime)lastTime=t;const dt=Math.min((t-lastTime)/1000,.035);lastTime=t;acc+=dt;while(acc>1/120){step(1/120);acc-=1/120}draw();requestAnimationFrame(frame)}
    function reset(){balls=[];score=0;coins=0;nextLevel=randomLevel();scoreEl.textContent='0';gameState='playing';canDrop=true;mergeCooldown=0;events=[];document.querySelectorAll('.modal').forEach(m=>m.classList.remove('open'));drawNext();draw()}
    function endGame(){gameState='over';document.getElementById('reviveModal').classList.remove('open');document.getElementById('finalScore').textContent=score;document.getElementById('finalBest').textContent=best;document.getElementById('nickLabel').textContent=storage.get('merge-bounce-name','玩家');const rows=storage.get('merge-bounce-scores',[]);rows.unshift({name:storage.get('merge-bounce-name','玩家'),score,time:Date.now()});storage.set('merge-bounce-scores',rows.slice(0,20));document.getElementById('overModal').classList.add('open')}
    function revive(){if(coins<=0)return;coins--;balls=balls.filter(b=>b.y+support(b,0,-1)>=lineY());for(const b of balls){if(b.y+support(b,0,-1)<lineY()+8){b.vy=0;b.y=lineY()+support(b,0,1)+8}}gameState='playing';document.getElementById('reviveModal').classList.remove('open');toast('继续加油！');sound(540,.09)}
    function showBoard(){const list=storage.get('merge-bounce-scores',[]),el=document.getElementById('leaderList');el.innerHTML='';if(!list.length){const li=document.createElement('li');li.style.gridTemplateColumns='1fr';li.textContent='还没有成绩，来成为第一位登上榜单的人吧 ✨';el.appendChild(li)}else list.forEach((r,i)=>{const li=document.createElement('li'),rank=document.createElement('span'),name=document.createElement('span'),pts=document.createElement('strong');rank.className='rank';rank.textContent=['🥇','🥈','🥉'][i]||String(i+1);name.textContent=r.name;pts.textContent=r.score.toLocaleString();li.append(rank,name,pts);el.appendChild(li)});document.getElementById('boardModal').classList.add('open')}
    function sound(freq,dur){if(muted)return;try{const ac=new(window.AudioContext||window.webkitAudioContext)(),o=ac.createOscillator(),g=ac.createGain();o.type='sine';o.frequency.value=freq;g.gain.setValueAtTime(.035,ac.currentTime);g.gain.exponentialRampToValueAtTime(.001,ac.currentTime+dur);o.connect(g);g.connect(ac.destination);o.start();o.stop(ac.currentTime+dur);o.onended=()=>ac.close()}catch{}}
    function pointerX(e){const r=board.getBoundingClientRect(),edge=bodyRadius({r:levels[nextLevel].r*.6,lvl:nextLevel});return clamp(e.clientX-r.left,edge,W-edge)}
    let touchAiming=false,touchPointerId=null;
    board.addEventListener('pointermove',e=>{if(gameState==='playing'){aimX=pointerX(e);draw()}});
    board.addEventListener('pointerdown',e=>{if(e.target.closest('.modal')||e.target.closest('.next-card'))return;e.preventDefault();aimX=pointerX(e);if(e.pointerType==='touch'){touchAiming=true;touchPointerId=e.pointerId;try{board.setPointerCapture(e.pointerId)}catch{}}else drop();draw()});
    board.addEventListener('pointerup',e=>{if(e.pointerType==='touch'&&touchAiming&&e.pointerId===touchPointerId){e.preventDefault();touchAiming=false;touchPointerId=null;try{board.releasePointerCapture(e.pointerId)}catch{};drop();draw()}});
    board.addEventListener('pointercancel',e=>{if(e.pointerId===touchPointerId){touchAiming=false;touchPointerId=null}});
    window.addEventListener('keydown',e=>{if(['ArrowLeft','ArrowRight',' '].includes(e.key))e.preventDefault();if(e.key==='ArrowLeft')aimX=clamp(aimX-18,15,W-15);if(e.key==='ArrowRight')aimX=clamp(aimX+18,15,W-15);if(e.key===' '){if(gameState==='playing')drop()}if(e.key.toLowerCase()==='r')reset();draw()});
    document.getElementById('restartBtn').onclick=reset;document.getElementById('restartBtn2').onclick=reset;document.getElementById('againBtn').onclick=reset;document.getElementById('declineRevive').onclick=endGame;document.getElementById('useRevive').onclick=revive;
    document.getElementById('boardBtn').onclick=showBoard;document.getElementById('boardBtn2').onclick=showBoard;document.getElementById('boardBtn3').onclick=showBoard;document.getElementById('boardClose').onclick=()=>document.getElementById('boardModal').classList.remove('open');document.getElementById('boardRefresh').onclick=showBoard;
    document.getElementById('sponsorBtn').onclick=()=>document.getElementById('supportModal').classList.add('open');document.getElementById('supportClose').onclick=()=>document.getElementById('supportModal').classList.remove('open');
    document.getElementById('soundBtn').onclick=e=>{muted=!muted;e.currentTarget.textContent=muted?'🔇':'🔊';e.currentTarget.setAttribute('aria-pressed',String(!muted));if(!muted)sound(520,.06)};
    document.getElementById('editName').onclick=()=>{const input=document.getElementById('nameInput'),save=document.getElementById('saveName');input.value=storage.get('merge-bounce-name','玩家');input.style.display='block';save.style.display='inline-block';input.focus()};document.getElementById('saveName').onclick=()=>{const val=document.getElementById('nameInput').value.trim().slice(0,12)||'玩家';storage.set('merge-bounce-name',val);document.getElementById('nickLabel').textContent=val;document.getElementById('nameInput').style.display='none';document.getElementById('saveName').style.display='none'};
    document.getElementById('helpBtn').onclick=()=>window.alert('鼠标：移动瞄准、点击投放；触屏：拖动瞄准、松手投放。\n← → 微调位置，空格投放，R 重开。\n两个相同的图标碰在一起就会合成。每 2000 分获得一枚本局复活币。');
    const grid=document.getElementById('mergeGrid');function redrawGallery(){grid.querySelectorAll('canvas').forEach((c,i)=>{const cg=c.getContext('2d');cg.clearRect(0,0,c.width,c.height);drawToken(cg,36,36,previewRadius(Math.min(28,levels[i].r*.6),i,31),i)})}levels.forEach((p,i)=>{const item=document.createElement('div');item.className='merge-item';const c=document.createElement('canvas');c.width=c.height=72;const label=document.createElement('span');label.textContent=p.name;item.append(c,label);grid.appendChild(item)});redrawGallery();
    function refreshImage(img,i){if(img&&img.complete&&img.naturalWidth){prepareShape(img,i);redrawGallery();drawNext();draw()}}
    iconImages.forEach((img,i)=>{if(!img)return;img.addEventListener('load',()=>refreshImage(img,i));img.addEventListener('error',()=>{redrawGallery();drawNext();draw()});setTimeout(()=>refreshImage(img,i),120)});setTimeout(()=>iconImages.forEach((img,i)=>refreshImage(img,i)),1500);nextLevel=randomLevel();drawNext();resize();requestAnimationFrame(frame);
  })();
  </script>
