<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <link rel="preload" href="icon-atlas-v2.webp?v=20261011-instant1" as="image" type="image/webp" fetchpriority="high">
  <meta name="theme-color" content="#fffaf0">
  <meta name="description" content="轻轻投下图标，让相同的图标相撞合成，看看你能走多远。">
  <title>合成🐎＋7</title>
  <style>
    :root{color-scheme:light;--ink:#493c32;--muted:#9c8e7d;--cream:#fffaf0;--line:#eadfc9;--orange:#f17d60;--gold:#efbd5c;--shadow:0 16px 48px #8e76521a}
    *{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:ui-rounded,"PingFang SC","Microsoft YaHei",system-ui,sans-serif;color:var(--ink)}
    body{min-height:100vh;background:radial-gradient(ellipse at 15% 10%,#ffe9c9 0,transparent 29%),radial-gradient(ellipse at 88% 78%,#f9dfe4 0,transparent 30%),linear-gradient(145deg,#fff8e8,#fffdf7 52%,#fbf1e7);display:flex;justify-content:center;overflow-x:hidden}
    button{font:inherit;color:inherit;border:0;cursor:pointer}button:focus-visible,input:focus-visible{outline:3px solid #efbd5c;outline-offset:3px}
    .app{width:min(100%,580px);padding:14px 14px 30px;display:flex;flex-direction:column;align-items:center;gap:12px}
    .topbar{width:100%;display:grid;grid-template-columns:1fr 1fr 48px 48px 86px;gap:7px;padding:7px;background:#ffffffd9;border:1px solid #fff;border-radius:24px;box-shadow:var(--shadow);backdrop-filter:blur(12px)}
    .scorebox{min-width:0;background:#fffdfa;border-radius:17px;padding:7px 12px;display:flex;flex-direction:column;justify-content:center;gap:1px;box-shadow:inset 0 0 0 1px #f3eddf}
    .scorebox span{font-size:10px;color:var(--muted);letter-spacing:.04em}.scorebox strong{font-size:20px;line-height:1.1;font-weight:800;color:#5a493c;font-variant-numeric:tabular-nums}
    .iconbtn,.restart{height:44px;border-radius:17px;background:#fffdfa;box-shadow:inset 0 0 0 1px #f2eddf;font-size:18px;transition:transform .16s,box-shadow .16s}.iconbtn:hover,.restart:hover{transform:translateY(-2px);box-shadow:0 6px 14px #6040201a}.iconbtn[aria-pressed="false"]{opacity:.55}
    .restart{background:linear-gradient(145deg,#f5946e,#e76859);color:white;font-size:13px;font-weight:800;box-shadow:0 5px 12px #e7685933}
    .board-shell{position:relative;width:min(100%,420px);padding:10px;border-radius:32px;background:linear-gradient(145deg,#fff,#fbf4e6);border:1px solid #fff;box-shadow:0 17px 44px #83704a21,inset 0 0 0 1px #efe7d7}
    .board{position:relative;isolation:isolate;width:100%;aspect-ratio: .56;min-height:480px;max-height:72vh;border-radius:23px;overflow:hidden;border:1px solid #e5d9c2;background:linear-gradient(180deg,#fffdf9 0%,#fff9ea 38%,#fff3d9 100%);touch-action:none}
    .board::before{content:"";position:absolute;z-index:0;inset:18% 8% 20%;background:url("shark-watermark-v2.webp") center/contain no-repeat;opacity:.11;pointer-events:none}
    .board::after{content:"@第七末那识";position:absolute;z-index:0;left:0;right:0;bottom:15%;text-align:center;color:#4f86b8;font-size:18px;font-weight:800;letter-spacing:.08em;opacity:.11;pointer-events:none}
    .board>canvas{position:relative;z-index:1}
    canvas{display:block;width:100%;height:100%;touch-action:none}
    .next-card{position:absolute;z-index:2;right:14px;top:12px;display:flex;align-items:center;gap:6px;padding:5px 8px 5px 10px;border-radius:14px;background:#ffffffd9;box-shadow:0 4px 14px #7b65451a;pointer-events:none}
    .next-card span{font-size:10px;color:#98836b}.next-card canvas{width:32px;height:32px}
    .hintline{position:absolute;z-index:2;left:12px;right:12px;top:24%;border-top:2px dashed #d9c9aa8c;pointer-events:none}
    .modal{position:absolute;inset:0;z-index:5;display:none;align-items:center;justify-content:center;padding:20px;background:#46382f5c;backdrop-filter:blur(4px)}.modal.open{display:flex}
    .dialog{width:min(100%,340px);max-height:88%;overflow:auto;padding:22px 20px 18px;border-radius:26px;text-align:center;background:linear-gradient(155deg,#fffdf8,#fff5df);border:1px solid #fff;box-shadow:0 20px 60px #32241f33;animation:pop .2s ease-out}
    @keyframes pop{from{opacity:0;transform:translateY(9px) scale(.97)}to{opacity:1;transform:none}}
    .modal-icon{font-size:38px;line-height:1}.dialog h2{margin:9px 0 4px;font-size:22px}.dialog p{margin:8px 0;color:#897967;font-size:13px;line-height:1.65}.modal-score{margin:12px 0;font-size:14px}.modal-score b{color:#e87959;font-size:24px}
    .actions{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:16px}.pill{padding:11px 15px;border-radius:15px;background:#f4eddf;font-size:13px;font-weight:750}.pill.primary{background:linear-gradient(145deg,#f29a69,#e96f5c);color:white;box-shadow:0 5px 12px #e56a5838}.pill.gold{background:#f4c768;color:#573e1e}.pill:hover{filter:brightness(1.03);transform:translateY(-1px)}
    .nick-row{margin:13px 0 5px;font-size:12px;color:#968575}.nick-row button{background:none;color:#dc785d;text-decoration:underline;text-underline-offset:3px}.name-input{display:none;width:100%;margin-top:8px;padding:10px 12px;border:1px solid #e8dbc1;border-radius:12px;background:white;font:inherit;text-align:center}
    .leader-list{max-height:240px;overflow:auto;margin:13px 0 6px;padding:0;list-style:none;text-align:left}.leader-list li{display:grid;grid-template-columns:34px 1fr auto;gap:8px;align-items:center;padding:9px 10px;border-bottom:1px solid #eee5d5;font-size:13px}.leader-list li:first-child{color:#bd8524}.leader-list .rank{font-weight:800;color:#aa997f}.leader-list strong{font-variant-numeric:tabular-nums}
    .underbar{width:min(100%,420px);display:flex;align-items:center;justify-content:center;gap:8px;flex-wrap:wrap}.underbar .pill{padding:9px 13px;border-radius:13px;background:#fffdf8;box-shadow:0 3px 12px #806b4915;font-size:12px}.rule-note{width:min(100%,420px);text-align:center;color:#877967;font-size:12px;line-height:1.8;padding:3px 7px 0}.rule-note strong{color:#705a46}.merge-card{width:min(100%,420px);padding:13px 14px;border-radius:20px;background:#ffffffa8;border:1px solid #fff;box-shadow:0 7px 22px #806b4910}.merge-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px;font-size:13px;font-weight:800}.merge-head small{font-weight:500;color:#a19483}.merge-grid{display:grid;grid-template-columns:repeat(6,1fr);gap:5px}.merge-item{display:flex;flex-direction:column;align-items:center;gap:3px;min-width:0;padding:7px 3px;border-radius:14px;background:#fffdf8}.merge-item canvas{width:36px;height:36px}.merge-item span{font-size:9px;color:#8c7e6c;white-space:nowrap}.footer{font-size:10px;color:#afa18e;text-align:center;padding-top:3px}
    @media(max-width:400px){.app{padding:9px 9px 23px;gap:9px}.topbar{grid-template-columns:1fr 1fr 42px 42px 72px;gap:5px;padding:6px}.scorebox{padding:6px 9px}.scorebox strong{font-size:18px}.iconbtn,.restart{height:41px;border-radius:15px}.board-shell{padding:8px;border-radius:27px}.board{border-radius:19px;min-height:0;max-height:74vh}.merge-grid{grid-template-columns:repeat(5,1fr)}}
    @media(max-height:740px){.board{max-height:67vh;min-height:380px}}
    html,body{height:100%;overscroll-behavior:none}
    .load-mask{position:absolute;inset:0;z-index:8;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:24px;text-align:center;background:#fff9ebf2;color:#725f4c}.load-mask[hidden]{display:none}.load-mask strong{font-size:16px}.load-mask button{padding:10px 16px;border-radius:14px;background:#f17d60;color:#fff;font-weight:800}.revive-chip{position:absolute;z-index:3;left:12px;top:12px;padding:4px 9px;border-radius:999px;background:linear-gradient(135deg,#ffe49a,#ffc24a);color:#684500;font-size:12px;font-weight:800;box-shadow:0 4px 12px #a86a1638;pointer-events:none}.revive-chip[hidden]{display:none}
    @media(max-width:680px){body{height:100dvh;min-height:0;overflow:hidden;padding:calc(8px + env(safe-area-inset-top)) calc(8px + env(safe-area-inset-right)) calc(8px + env(safe-area-inset-bottom)) calc(8px + env(safe-area-inset-left))}.app{height:100%;min-height:0;padding:0;gap:8px;justify-content:flex-start}.topbar{flex:0 0 auto;border-radius:18px}.board-shell{flex:0 1 auto;height:min(calc(100dvh - 92px - env(safe-area-inset-top) - env(safe-area-inset-bottom)),calc(96vw * 700 / 420));width:auto;max-width:96vw;aspect-ratio:420/700;padding:8px;border-radius:24px}.board{width:100%;height:100%;min-height:0;max-height:none;aspect-ratio:auto;border-radius:18px}.underbar,.merge-card,.rule-note,.footer{display:none!important}.next-card{right:10px;top:9px}.hintline{top:20.2857%}}
    @media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important;scroll-behavior:auto!important}}
  </style>
</head>
<body>
  <main class="app" aria-label="合成🐎＋7游戏">
    <header class="topbar">
      <div class="scorebox"><span>分数</span><strong id="score">0</strong></div>
      <div class="scorebox"><span>最高分</span><strong id="best">0</strong></div>
      <button class="iconbtn" id="boardBtn" aria-label="打开排行榜" title="排行榜">🏆</button>
      <button class="iconbtn" id="soundBtn" aria-label="切换音效" aria-pressed="true" title="音效开关">🔊</button>
      <button class="restart" id="restartBtn" title="重新开始">↻ 重开</button>
    </header>
    <section class="board-shell" aria-label="游戏区域">
      <div class="board" id="board">
        <canvas id="game" aria-label="游戏画面，移动瞄准并点击投放"></canvas>
        <div class="hintline"></div>
        <div class="next-card"><span>下一个</span><canvas id="nextIcon" width="64" height="64"></canvas></div>
        <div class="revive-chip" id="reviveBadge" hidden>🪙 ×<span id="reviveCount">0</span></div>
        <div class="load-mask" id="loadMask" hidden><strong id="loadText">正在加载全部图标…</strong><button id="loadRetry" hidden>重新加载</button></div>
        <div class="modal" id="reviveModal" role="dialog" aria-modal="true" aria-labelledby="reviveTitle">
          <div class="dialog"><div class="modal-icon">😵</div><h2 id="reviveTitle">还能再救一下</h2><p class="modal-score">本局得分 <b id="reviveScore">0</b></p><p>清掉警戒线以上的图标，接着玩</p><div class="actions"><button class="pill" id="declineRevive">结束本局</button><button class="pill gold" id="useRevive">🪙 用一枚复活币</button></div><p id="coinCount" style="margin-top:10px">还剩 0 枚</p></div>
        </div>
        <div class="modal" id="overModal" role="dialog" aria-modal="true" aria-labelledby="overTitle">
          <div class="dialog"><div class="modal-icon">😵</div><h2 id="overTitle">游戏结束</h2><p class="modal-score">本局得分 <b id="finalScore">0</b></p><p>最高分 <strong id="finalBest">0</strong></p><div class="nick-row">昵称：<span id="nickLabel">玩家</span> <button id="editName">改昵称</button><input class="name-input" id="nameInput" maxlength="12" aria-label="我的昵称" placeholder="输入昵称"><button class="name-input" id="saveName">保存昵称</button></div><div class="actions"><button class="pill" id="boardBtn2">🏆 排行榜</button><button class="pill primary" id="againBtn">再来一局</button></div><p>按 R 键也可重新开始</p></div>
        </div>
        <div class="modal" id="boardModal" role="dialog" aria-modal="true" aria-labelledby="boardTitle">
          <div class="dialog"><h2 id="boardTitle">🏆 最近高手榜</h2><p>本机最近 20 次成绩</p><ul class="leader-list" id="leaderList"></ul><div class="actions"><button class="pill" id="boardClose">关闭</button><button class="pill primary" id="boardRefresh">刷新</button></div></div>
        </div>
      </div>
    </section>
    <div class="underbar"><button class="pill" id="boardBtn3">🏆 排行榜</button><button class="pill" id="restartBtn2">↻ 重开</button><button class="pill" id="helpBtn">⌨️ 操作说明</button></div>
    <section class="merge-card" aria-label="合成图鉴"><div class="merge-head"><span>合成图鉴</span><small>两个相同图标相撞即可合成</small></div><div class="merge-grid" id="mergeGrid"></div></section>
    <p class="rule-note"><strong>鼠标</strong>：移动瞄准、点击投放；<strong>触屏</strong>：拖动瞄准、松手投放。<br>← → 微调位置，空格投放，R 重开。每 2000 分获得一枚本局复活币。</p>
    <p class="footer">图标可以替换成你喜欢的样子</p>
  </main>
  <script src="game-instant-v1.js"></script>
</body>
</html>
